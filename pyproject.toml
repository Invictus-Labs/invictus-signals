[project]
name = "invictus-signals"
version = "0.1.0"
description = "Universal price action engine — regime classification, line detection, pattern matching"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=invictus_signals --cov-report=term-missing --cov-fail-under=90"
